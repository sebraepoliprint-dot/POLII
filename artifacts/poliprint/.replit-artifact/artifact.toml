kind = "mobile"
previewPath = "/"
title = "PoliPrint"
description = "A mobile operations app for PoliPrint that connects customers, technicians, and stock staff through service requests, inventory orders, attendance tracking, and delivery receipts."
version = "1.0.0"
id = "artifacts/poliprint"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24392

[services.development]
run = "pnpm --filter @workspace/poliprint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/poliprint", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/poliprint", "run", "serve" ]

[services.env]
PORT = "24392"
BASE_PATH = "/"
